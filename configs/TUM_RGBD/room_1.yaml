inherit_from: ./configs/TUM_RGBD/tum.yaml
scene: room4-full
dataset: 'CoFusion'
data:
  input_folder: room4-full
cam:  #intrinsic is same per scene in BONN
  png_depth_scale: 1.0
  H: 540
  W: 960
  fx: 564.3
  fy: 564.3
  cx: 480
  cy: 270
  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  k3: 0.0
  near: 0.1
  far: 5
  H_edge: 0
  W_edge: 0
  H_out: 384
  W_out: 512
tracking:
  buffer: 1200
  motion_filter:
    thresh: 13
    dynamic_later: True
    dynamic_thresh: 0.5
    dynamic_frame: 771
  #flow_loss: 1
  #flow_loss_fine: 3
  #delta: 4
mapping:
  Training:
    flow_loss: 1
    #flow_loss_fine: 3
    #delta: 4
meshing:
  seg_ball: True
mapping:
  Calibration:
    depth_scale: 1.0
  first_s: 2.9869680404663086
  shift: 1.1
  s: 1.135
